# docker-compose.pull.yml
# Utilise l'image publiée sur Docker Hub (dserigne/todo-app:latest) au lieu de builder.
# À utiliser après : docker pull dserigne/todo-app:latest (ou laisser compose faire le pull).
# Prérequis : être dans le dépôt (pour .env, docker/nginx/default.conf) et avoir un .env configuré.

version: '3.8'

services:
  app:
    image: dserigne/todo-app:latest
    container_name: todo-app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file: .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
    networks:
      - todo
    depends_on:
      - mysql
      - redis
    healthcheck:
      test: ["CMD", "php", "-r", "$$c=@fsockopen('127.0.0.1',9000);if($$c){fclose($$c);exit(0);}exit(1);"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 120s

  nginx:
    image: nginx:alpine
    container_name: todo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    networks:
      - todo
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: todo-mysql-v1
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${DB_PASSWORD}}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    ports:
      - "3306:3306"
    networks:
      - todo
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: todo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - todo
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  todo:
    driver: bridge
